<h2>Recupera tu acceso</h2>
<p>Pulsa el botón para crear una nueva contraseña. El enlace sirve una sola vez y caduca en 1 hora.</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/nueva-contrasena"
     style="display:inline-block;padding:12px 20px;background:#4f46e5;color:#ffffff;border-radius:8px;text-decoration:none;font-weight:600">
    Crear nueva contraseña
  </a>
</p>
<p style="color:#71717a;font-size:13px">Si no pediste cambiar tu contraseña, ignora este correo.</p>
